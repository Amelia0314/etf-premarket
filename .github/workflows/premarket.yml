name: ETF期权消息推送

on:
  schedule:
    # 北京时间 9:00 = UTC 1:00（盘前）
    - cron: '0 1 * * 1-5'
    # 北京时间 11:35 = UTC 3:35（午间收盘后）
    - cron: '35 3 * * 1-5'
    # 北京时间 15:05 = UTC 7:05（收盘后5分钟）
    - cron: '5 7 * * 1-5'
    # 北京时间 16:00 = UTC 8:00（盘后复盘，可拿完整数据）
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行消息推送脚本
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          TZ: Asia/Shanghai
        run: python premarket.py
